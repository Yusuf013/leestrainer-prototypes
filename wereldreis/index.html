<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leestrainer Wereldreis – prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#24313a; --ink-soft:#5a6a73; --paper:#fbf6ec; --sand:#efe2c8; --sand-2:#e4d1ab;
  --green:#3f7d52; --green-2:#2f6440; --blue:#2e6f9e; --blue-2:#1f5379; --earth:#b8743a; --red:#c8553d;
  --card:#fffdf8; --line:#e6d9bf; --ok:#2f8a4c; --ok-bg:#e3f3e6; --warn:#b4632b; --warn-bg:#fbeadc;
  --accent:var(--green); --accent-2:var(--green-2); --tint:#eef4ea;
  --radius:18px; --shadow:0 10px 30px rgba(60,45,20,.12), 0 2px 6px rgba(60,45,20,.08);
  --read-size:20px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);
  background-image:radial-gradient(circle at 10% 0%,#f3e7cf 0,transparent 40%),radial-gradient(circle at 100% 100%,#e6efe0 0,transparent 45%);
  background-attachment:fixed;min-height:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:"Nunito",system-ui,sans-serif;letter-spacing:.2px;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.word:focus-visible{outline:3px solid #f0a945;outline-offset:2px}
.hidden{display:none!important}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;position:sticky;top:0;z-index:20;
  background:rgba(251,246,236,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.brand-logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center;box-shadow:var(--shadow)}
.brand-title{font-family:sans-serif;font-weight:800;font-size:22px;line-height:1}
.brand-sub{font-size:13px;color:var(--ink-soft);font-weight:700}
.passport-btn{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px 7px 8px;font-weight:800}
.passport-btn .pp-icon{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:16px}
.passport-btn:hover{border-color:var(--blue)}
.stamp-count{background:var(--sand);border-radius:999px;padding:2px 9px;font-size:14px}

main{max-width:1240px;margin:0 auto;padding:18px 22px 60px}

/* ---------- globe screen ---------- */
.globe-screen{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.9fr);gap:28px;align-items:center;min-height:calc(100vh - 110px)}
.globe-wrap{position:relative;display:flex;justify-content:center;align-items:center}
.space{position:relative;width:100%;max-width:min(700px,80vh);aspect-ratio:1/1;border-radius:32px;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 50% 45%,#1b3966 0%,#0c1b3a 52%,#050b1a 100%);box-shadow:0 20px 50px rgba(10,20,40,.35)}
.space.dragging{cursor:grabbing}
.space #globe{position:absolute;inset:0;width:100%;height:100%;display:block}
.space.flat{display:flex;align-items:center;justify-content:center}
.space.flat #globe{position:relative;inset:auto}
.space.flat .zoom-ctrl{display:none}
.pins{position:absolute;inset:0;pointer-events:none}
.pin3d{position:absolute;left:0;top:0;width:0;height:0;border:0;padding:0;background:none;pointer-events:auto;will-change:transform}
.pin-dot{position:absolute;left:-21px;top:-21px;width:42px;height:42px;border-radius:50%;background:#fffdf8;border:3px solid var(--c);display:grid;place-items:center;font-size:21px;box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .2s}
.pin3d:not(.soon) .pin-dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--c);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.pin-label{position:absolute;top:26px;left:0;transform:translateX(-50%);white-space:nowrap;background:rgba(255,253,248,.95);color:var(--ink);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.3);transition:opacity .2s}
.pin3d.soon .pin-dot{background:#d9d4ca;border-color:#9a9284;filter:saturate(.4);width:34px;height:34px;left:-17px;top:-17px;font-size:17px}
.pin3d.soon .pin-label{opacity:0;top:22px}
.pin3d.soon:hover .pin-label,.pin3d.soon.sel .pin-label,.pin3d.soon:focus-visible .pin-label{opacity:1}
.pin3d:hover .pin-dot,.pin3d.sel .pin-dot{transform:scale(1.18)}
.pin3d:focus-visible{outline:none}.pin3d:focus-visible .pin-dot{outline:3px solid #f0a945;outline-offset:3px}
.zoom-ctrl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.zoom-ctrl button{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-size:22px;font-weight:800;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.zoom-ctrl button:hover{background:rgba(255,255,255,.22)}
.globe-loading{position:absolute;inset:0;display:grid;place-items:center;color:#cfe0ff;font-weight:800;font-size:17px}
.globe-loading span{animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4}}
.map-credit{position:absolute;right:14px;bottom:10px;font-size:11px;color:rgba(220,230,255,.5);pointer-events:none}
#globe{touch-action:none;display:block;max-width:100%}
.globe-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(10,20,40,.55);color:#e6efff;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.panel{background:var(--card);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.welcome{padding:28px}
.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:12px;font-weight:800;color:var(--earth)}
.welcome h1{font-size:40px;margin:6px 0 10px}
.welcome p{color:var(--ink-soft);font-size:17px;line-height:1.55;margin:0 0 18px}
.dest-list{display:grid;gap:10px}
.dest-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;transition:transform .15s,border-color .15s}
.dest-item:hover{transform:translateY(-2px);border-color:var(--accent)}
.dest-item .dot{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none}
.dest-item strong{display:block;font-size:17px}
.dest-item span{font-size:14px;color:var(--ink-soft);font-weight:600}
.dest-item .go{margin-left:auto;font-weight:800;color:var(--accent)}
.dest-item.soon{opacity:.65;border-style:dashed}
.dest-item.soon .go{color:var(--ink-soft);font-size:13px}
.done-badge{font-size:12px;background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:2px 8px;margin-left:6px;font-weight:800}

.intro-card .intro-img{aspect-ratio:2/1;position:relative;overflow:hidden}
.intro-card .intro-img svg{width:100%;height:100%;display:block}
.intro-card .intro-body{padding:22px 26px 26px}
.intro-card h2{font-size:32px;margin:6px 0 8px}
.intro-card p{font-size:17px;line-height:1.55;color:var(--ink-soft);margin:0 0 14px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--accent-2);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:800;font-size:17px;transition:transform .12s,box-shadow .12s,background .12s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-2)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;border:2px solid var(--line)}
.btn-ghost:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.soon-card{padding:28px}
.soon-card h2{font-size:30px;margin:8px 0}
.soon-card p{color:var(--ink-soft);font-size:17px;line-height:1.55}

/* ---------- themes ---------- */
.theme-afrika{--accent:#b8662a;--accent-2:#8f4c1b;--tint:#f8ead8;--page:#fbf3e6}
.theme-parijs{--accent:#3f6aa8;--accent-2:#2c4f83;--tint:#e6eef9;--page:#f5f4f8}
.theme-japan{--accent:#c2453a;--accent-2:#952f27;--tint:#fbe6e3;--page:#fbf5f1}
.theme-amazone{--accent:#2f7d4a;--accent-2:#225c36;--tint:#e3f1e6;--page:#f1f7ef}

/* ---------- story ---------- */
.story-screen{max-width:900px;margin:0 auto}
.story-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tool-group{display:flex;gap:8px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 13px;font-weight:800;font-size:15px}
.tool:hover{border-color:var(--accent)}
.tool.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hero{border-radius:24px;overflow:hidden;position:relative;box-shadow:var(--shadow);aspect-ratio:2.4/1;min-height:200px}
.hero svg{width:100%;height:100%;display:block}
.hero-title{position:absolute;left:0;right:0;bottom:0;padding:60px 28px 36px;background:linear-gradient(transparent,rgba(20,15,10,.62));color:#fff}
.hero-title .eyebrow{color:#ffe2b8}
.hero-title h1{font-size:clamp(28px,4.4vw,44px);text-shadow:0 2px 10px rgba(0,0,0,.25)}
.reading{background:var(--card);border-radius:24px;border:1px solid var(--line);padding:34px clamp(20px,5vw,60px);margin-top:-18px;position:relative;box-shadow:var(--shadow)}
.reading .lead{font-size:calc(var(--read-size) - 1px);font-weight:700;color:var(--accent-2);background:var(--tint);border-radius:14px;padding:14px 18px;margin:0 0 24px;line-height:1.55}
.reading p.para{font-size:var(--read-size);line-height:1.85;margin:0 0 20px;max-width:64ch;transition:background .3s;border-radius:10px;padding:2px 6px;margin-left:-6px}
.reading p.para.speaking{background:#fff4d6}
.word{font:inherit;color:var(--accent-2);font-weight:800;background:var(--tint);border:0;border-bottom:3px dotted var(--accent);border-radius:6px;padding:0 4px;margin:0 1px;line-height:inherit;transition:background .15s}
.word:hover{background:#fff0c9}
.word.found{border-bottom-style:solid;background:#fff}
.word.found::after{content:" ✓";font-size:.75em;color:var(--ok)}
.how-to{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-soft);font-weight:700;margin:0 0 20px}
.how-to .sample{color:var(--accent-2);background:var(--tint);border-bottom:3px dotted var(--accent);border-radius:6px;padding:0 4px;font-weight:800}
.tracker{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 20px}
.tracker-words{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tracker-label{font-weight:800;margin-right:4px}
.tw{border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;background:#f2ede2;color:#a89f8c;border:2px dashed #d8cdb6}
.tw.found{background:var(--tint);color:var(--accent-2);border:2px solid var(--accent)}
body.large{--read-size:24px}

/* ---------- dialog ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,25,15,.45);display:grid;place-items:center;z-index:50;padding:18px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dialog{background:var(--card);border-radius:26px;max-width:480px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.3);overflow:hidden;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.dialog-visual{background:var(--tint);padding:22px;display:grid;place-items:center;position:relative}
.dialog-visual .big-emoji{font-size:76px;line-height:1}
.close-x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:20px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.dialog-body{padding:20px 26px 26px}
.dialog h2{font-size:38px;color:var(--accent-2)}
.syllables{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.syl{background:#f4efe4;border-radius:10px;padding:5px 12px;font-weight:800;font-size:20px;transition:all .2s}
.syl.active{background:var(--accent);color:#fff;transform:translateY(-3px)}
.dialog .explain{font-size:19px;line-height:1.55;margin:0 0 10px}
.dialog .example{font-size:16px;color:var(--ink-soft);font-style:italic;margin:0 0 18px;line-height:1.5}
.dialog .btn{font-size:16px;padding:11px 16px}
.speech-note{font-size:13px;color:var(--ink-soft);margin-top:12px}

/* ---------- activity ---------- */
.act-screen{max-width:900px;margin:0 auto}
.act-head{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 28px;box-shadow:var(--shadow);display:flex;gap:18px;align-items:center}
.act-head .act-emoji{font-size:48px;width:76px;height:76px;border-radius:20px;background:var(--tint);display:grid;place-items:center;flex:none}
.act-head h1{font-size:30px;margin:4px 0 6px}
.act-head p{margin:0;color:var(--ink-soft);font-size:17px;line-height:1.5}
.act-body{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 28px;box-shadow:var(--shadow)}
.feedback{min-height:56px;margin-top:18px;border-radius:16px;padding:14px 18px;font-size:17px;font-weight:700;line-height:1.45}
.feedback.ok{background:var(--ok-bg);color:#1f5e34}
.feedback.hint{background:var(--warn-bg);color:#7a3f15}
.feedback.neutral{background:#f4efe4;color:var(--ink-soft)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* match */
.match-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:22px}
.col-title{font-weight:800;color:var(--ink-soft);font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.m-words,.m-pics{display:grid;gap:10px}
.m-pics{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.m-word{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-weight:800;font-size:19px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.m-word .mini-say{font-size:16px;opacity:.6}
.m-pic{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 8px;font-size:42px;min-height:104px;display:grid;place-items:center;line-height:1}
.m-pic small{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:6px;line-height:1.25}
.m-word:hover,.m-pic:hover{border-color:var(--accent)}
.sel{border-color:var(--accent)!important;background:var(--tint)!important;box-shadow:0 0 0 3px var(--tint)}
.matched{border-color:var(--ok)!important;background:var(--ok-bg)!important;cursor:default}
.m-pic.matched::after{content:attr(data-label);display:block;font-size:14px;font-weight:800;color:var(--ok);margin-top:6px}

/* fill */
.progress-dots{display:flex;gap:6px;margin-bottom:18px}
.progress-dots span{width:28px;height:8px;border-radius:99px;background:#eee4d1}
.progress-dots span.done{background:var(--ok)}
.progress-dots span.now{background:var(--accent)}
.fill-sentence{font-size:24px;line-height:1.7;font-weight:700;margin:0 0 22px}
.blank{display:inline-block;min-width:150px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent-2);padding:0 6px}
.blank.filled{border-color:var(--ok);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.choice{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;font-weight:800;font-size:18px}
.choice:hover{border-color:var(--accent)}
.choice.used{opacity:.35;pointer-events:none}

/* spot */
.message{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:26px;flex:none}
.bubble{background:var(--tint);border-radius:4px 18px 18px 18px;padding:12px 16px;font-size:18px;font-weight:700;line-height:1.5}
.bubble .say{border:0;background:#fff;border-radius:8px;padding:2px 8px;margin-left:6px;font-size:15px}
.spot-sentence{font-size:25px;line-height:2;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 20px}
.tok{border:0;background:transparent;font:inherit;padding:2px 5px;border-radius:8px;margin:0 -1px}
.tok:hover{background:#f4efe4}
.tok.right{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 -3px 0 var(--ok)}
.tok.wrong{background:var(--warn-bg)}

/* done */
.done-screen{max-width:640px;margin:30px auto;text-align:center}
.done-card{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:36px 30px}
.stamp{width:170px;height:170px;margin:0 auto 18px;animation:stampIn .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{0%{transform:scale(2.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.done-card h1{font-size:38px;margin-bottom:8px}
.done-card p{font-size:18px;color:var(--ink-soft);line-height:1.55}
.learned{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 24px}

/* passport */
.pp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.pp-slot{border:2px dashed var(--line);border-radius:16px;aspect-ratio:1;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:800;color:var(--ink-soft);padding:6px}
.pp-slot svg{width:88%;height:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:90vw}

/* ---------- boekkeuze ---------- */
.top-right{display:flex;align-items:center;gap:10px}
.book-chip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 6px;font-weight:800;max-width:340px}
.book-chip:hover{border-color:var(--blue)}
.bc-avi{color:#fff;border-radius:999px;padding:4px 10px;font-family:sans-serif;font-weight:800;font-size:15px;white-space:nowrap}
.bc-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-change{font-size:12px;color:var(--ink-soft);background:var(--sand);border-radius:999px;padding:2px 8px}
.books-screen{max-width:1120px;margin:0 auto}
.books-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 18px}
.books-head h1{font-size:44px;margin:4px 0 6px}
.books-sub{margin:0;color:var(--ink-soft);font-size:18px;max-width:560px;line-height:1.5}
.explain-card{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:20px;box-shadow:var(--shadow);animation:pop .25s}
.ex-item{display:flex;gap:12px;align-items:flex-start}
.ex-item b{display:block;margin-bottom:2px}
.ex-item span:not(.ex-badge){font-size:15px;color:var(--ink-soft);line-height:1.45}
.ex-badge{flex:none;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-family:sans-serif;font-weight:800;font-size:20px;color:#fff}
.groep-tabs{display:inline-flex;flex-wrap:wrap;background:#efe5cf;border-radius:999px;padding:5px;gap:4px;margin-bottom:26px}
.groep-tab{border:0;background:transparent;border-radius:999px;padding:10px 20px;font-weight:800;font-size:16px;color:var(--ink-soft)}
.groep-tab:hover{color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================================================================
   SPRAAK (Web Speech API – werkt in Chrome, Edge en Safari)
   ================================================================ */
const Speech = {
  ok: 'speechSynthesis' in window, voice:null, gen:0,
  pick(){ if(!this.ok) return; const vs=speechSynthesis.getVoices().filter(v=>/^nl/i.test(v.lang));
    this.voice = vs.find(v=>/google/i.test(v.name)) || vs.find(v=>/nl-NL/i.test(v.lang)) || vs[0] || null; },
  stop(){ this.gen++; if(this.ok) speechSynthesis.cancel(); },
  say(text,{rate=.88,onend,_seq}={}){
    if(!_seq) this.gen++;
    if(!this.ok){ toast('Voorlezen werkt niet in deze browser.'); onend&&onend(); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='nl-NL'; if(this.voice) u.voice=this.voice; u.rate=rate;
    let done=false; const fin=()=>{ if(done) return; done=true; onend&&onend(); };
    u.onerror=fin;
    const guard=setTimeout(fin, 1200 + text.length*140);
    u.onend=()=>{clearTimeout(guard);fin()};
    speechSynthesis.speak(u);
  },
  sequence(parts,{rate=.8,gap=250,onstep,onend}={}){
    let i=0; const g=++this.gen; const next=()=>{ if(g!==this.gen) return; if(i>=parts.length){ onend&&onend(); return; } onstep&&onstep(i);
      this.say(parts[i],{rate,_seq:true,onend:()=>{ i++; setTimeout(next,gap); }}); };
    next();
  }
};
if(Speech.ok){ Speech.pick(); speechSynthesis.onvoiceschanged=()=>Speech.pick(); }

let toastTimer;
function toast(msg){ let t=$('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)} t.textContent=msg; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(),2600); }

function buildClouds(w=1024,h=512){

  for(let i=255;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; }
  const perm=new Uint8Array(512); for(let i=0;i<512;i++) perm[i]=p[i&255];
  const fade=t=>t*t*(3-2*t), L=(a,b,t)=>a+(b-a)*t, Hh=(x,y,z)=>perm[perm[perm[x&255]+(y&255)]+(z&255)]/255;
  const noise=(x,y,z)=>{ const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z), xf=fade(x-xi),yf=fade(y-yi),zf=fade(z-zi);
    const a=L(L(Hh(xi,yi,zi),Hh(xi+1,yi,zi),xf),L(Hh(xi,yi+1,zi),Hh(xi+1,yi+1,zi),xf),yf);
    const b=L(L(Hh(xi,yi,zi+1),Hh(xi+1,yi,zi+1),xf),L(Hh(xi,yi+1,zi+1),Hh(xi+1,yi+1,zi+1),xf),yf); return L(a,b,zf); };
  const c=mkCanvas(w,h), ctx=c.getContext('2d'), img=ctx.createImageData(w,h), d=img.data;
  const cosT=new Float32Array(w), sinT=new Float32Array(w);
  for(let i=0;i<w;i++){ const lon=((i+.5)/w*360-180)*RAD; cosT[i]=Math.cos(lon); sinT[i]=Math.sin(lon); }
  for(let j=0;j<h;j++){ const latd=90-(j+.5)/h*180, lat=latd*RAD, cl=Math.cos(lat), y=Math.sin(lat)*2.2, al=Math.abs(latd);
    const m=.55+.25*Math.exp(-(((latd-5)/9)**2))+.3*Math.exp(-(((al-57)/12)**2))-.25*Math.exp(-(((al-25)/9)**2));
    const thr=.575-.16*m;
    for(let i=0;i<w;i++){ const x=cl*cosT[i], z=cl*sinT[i];
      let f=0,amp=.5,fr=2.4; for(let o=0;o<5;o++){ f+=amp*noise(x*fr+11.3,y*fr+3.7,z*fr+7.1); amp*=.5; fr*=2.07; }
      let v=(f-thr)/.2; v=v<0?0:v>1?1:v; v=v*v*(3-2*v);
      const k=(j*w+i)*4; d[k]=d[k+1]=d[k+2]=255; d[k+3]=v*228; } }
  ctx.putImageData(img,0,0); return c;
}
function glowTexture(){ const c=mkCanvas(256,256), x=c.getContext('2d'), g=x.createRadialGradient(128,128,0,128,128,128);
  [[0,'rgba(120,185,255,.9)'],[.7,'rgba(120,185,255,.9)'],[.74,'rgba(120,185,255,.75)'],[.79,'rgba(100,165,255,.35)'],[.88,'rgba(80,140,255,.1)'],[1,'rgba(80,140,255,0)']].forEach(s=>g.addColorStop(...s));
  x.fillStyle=g; x.fillRect(0,0,256,256); return c; }

const Globe3D = {

  mount(space){

    this.tilt=new T.Group(); this.spin=new T.Group(); this.tilt.add(this.spin); scene.add(this.tilt);
    const tx=c=>{ const t=new T.CanvasTexture(c); t.anisotropy=Math.min(8,r.capabilities.getMaxAnisotropy()); return t; };
    const earth=new T.Mesh(new T.SphereGeometry(1,96,64), new T.MeshPhongMaterial({map:tx(EARTH.map),bumpMap:tx(EARTH.bump),bumpScale:.03,specularMap:tx(EARTH.spec),specular:new T.Color(0x4a5a6a),shininess:24}));
    this.spin.add(earth);
    this.clouds=new T.Mesh(new T.SphereGeometry(1.014,96,64), new T.MeshLambertMaterial({map:tx(EARTH.clouds),transparent:true,depthWrite:false}));
    this.spin.add(this.clouds);
    const glow=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(glowTexture()),blending:T.AdditiveBlending,transparent:true,depthWrite:false}));
    glow.scale.set(2.8,2.8,1); scene.add(glow);
    const vs='varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }';
    const rim=new T.Mesh(new T.SphereGeometry(1.016,64,48), new T.ShaderMaterial({vertexShader:vs,
      fragmentShader:'varying vec3 vN; void main(){ float i=pow(1.0-max(0.0,dot(vN,vec3(0.0,0.0,1.0))),3.0); gl_FragColor=vec4(0.45,0.72,1.0,1.0)*i*0.85; }',
      blending:T.AdditiveBlending,transparent:true,depthWrite:false}));
    scene.add(rim);
    scene.add(new T.AmbientLight(0xffffff,.42));
    const sun=new T.DirectionalLight(0xfff4e2,1.12); sun.position.set(-4,2.6,4.4); scene.add(sun);
    const N=1500, pos=new Float32Array(N*3); let s=5; const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
    for(let i=0;i<N;i++){ const u=rnd()*2-1, t=rnd()*Math.PI*2, rr=45+rnd()*25, q=Math.sqrt(1-u*u); pos[i*3]=rr*q*Math.cos(t); pos[i*3+1]=rr*u; pos[i*3+2]=rr*q*Math.sin(t); }
    const sg=new T.BufferGeometry(); sg.setAttribute('position',new T.BufferAttribute(pos,3));
    this.stars=new T.Points(sg,new T.PointsMaterial({color:0xdfe8ff,size:.16,transparent:true,opacity:.85,depthWrite:false})); this.stars.visible=false; scene.add(this.stars);

    pinsEl.querySelectorAll('.pin3d').forEach(b=>{ b.addEventListener('pointerdown',e=>e.stopPropagation()); b.onclick=()=>selectDest(b.dataset.id); });
    const ll=(lon,lat)=>new T.Vector3(Math.cos(lat*RAD)*Math.cos(lon*RAD),Math.sin(lat*RAD),-Math.cos(lat*RAD)*Math.sin(lon*RAD));
    this.pins=currentStories().map(d=>({d,el:pinsEl.querySelector(`[data-id="${d.id}"]`),v:ll(d.lon,d.lat)}));
    this.tmp=new T.Vector3();
    // besturing
    space.addEventListener('pointerdown',e=>this.down(e)); space.addEventListener('pointermove',e=>this.move(e));
    space.addEventListener('pointerup',()=>this.up()); space.addEventListener('pointercancel',()=>this.up());
    space.querySelector('#zIn').onclick=()=>{ this.zoom=Math.max(2.9,this.zoom-.45); };
    space.querySelector('#zOut').onclick=()=>{ this.zoom=Math.min(5.6,this.zoom+.45); };
    space.querySelectorAll('.zoom-ctrl button').forEach(b=>b.addEventListener('pointerdown',e=>e.stopPropagation()));
    this.ro=new ResizeObserver(()=>this.resize()); this.ro.observe(space); this.resize();
    cancelAnimationFrame(this.raf); const loop=()=>{ this.frame(); this.raf=requestAnimationFrame(loop); }; loop();
  },
  unmount(){ cancelAnimationFrame(this.raf); this.ro&&this.ro.disconnect(); this.ro=null;
    if(this.scene){ this.scene.traverse(o=>{ o.geometry&&o.geometry.dispose(); const m=o.material; if(m){ ['map','bumpMap','specularMap'].forEach(k=>m[k]&&m[k].dispose()); m.dispose(); } }); this.scene=null; }
    if(this.renderer){ this.renderer.dispose(); this.renderer=null; } },
  resize(){ if(!this.renderer) return; const w=this.space.clientWidth, h=this.space.clientHeight; if(!w||!h) return;
    this.renderer.setSize(w,h,false); this.cam.aspect=w/h; this.cam.updateProjectionMatrix(); this.w=w; this.h=h; },
  frame(){

      this.lam=tw.l0+tw.dl*e; this.phi=tw.p0+(tw.p1-tw.p0)*e; if(tw.k>=1) this.tween=null; }

      const o=Math.max(0,Math.min(1,(facing-.28)*5)); p.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
      p.el.style.opacity=o; p.el.style.visibility=o>0?'visible':'hidden'; p.el.classList.toggle('sel',state.selected===p.d.id); }

  down(e){ this.drag={x:e.clientX,y:e.clientY}; this.tween=null; this.space.setPointerCapture(e.pointerId); this.space.classList.add('dragging'); const h=$('.globe-hint'); if(h) h.style.opacity=0; },
  move(e){ if(!this.drag) return; const dx=e.clientX-this.drag.x, dy=e.clientY-this.drag.y, k=60/(this.w*.36*(4.4/this.camZ));

  up(){ this.drag=null; this.space&&this.space.classList.remove('dragging'); },
  focus(d){ const dl=((d.lon-this.lam)%360+540)%360-180; this.tween={k:0,l0:this.lam,dl,p0:this.phi,p1:Math.max(-40,Math.min(45,d.lat*.85))}; this.vl=0; this.vp=0; }
};

    <article class="reading">
      <p class="lead">${esc(d.lead)}</p>
      <p class="how-to">💡 Tik op een <span class="sample">gekleurd woord</span> om te ontdekken wat het betekent.</p>
      ${d.paragraphs.map((t,i)=>`<p class="para" data-i="${i}">${wordKeyHTML(t)}</p>`).join('')}
    </article>
    <div class="tracker"><div class="tracker-words"><span class="tracker-label">Ontdekte woorden:</span><span id="twList"></span></div>
      <button class="btn btn-primary" id="toAct">Op naar de opdracht →</button></div></section>`;
  const tw=()=>{ $('#twList').innerHTML = Object.keys(d.words).map(k=>`<span class="tw ${state.found[d.id].has(k)?'found':''}">${state.found[d.id].has(k)?k:'?'.repeat(Math.min(k.length,6))}</span>`).join(' '); };
  tw();
  app.querySelectorAll('.word').forEach(b=>b.onclick=()=>{ openWord(d,b.dataset.key,()=>{ app.querySelectorAll(`.word[data-key="${b.dataset.key}"]`).forEach(x=>x.classList.add('found')); tw(); }); });
  $('#toGlobe').onclick=()=>go('globe');
  $('#toAct').onclick=()=>go('activity',d.id);
  const sb=$('#sizeBtn'); const syncSize=()=>{const on=document.body.classList.contains('large'); sb.classList.toggle('on',on); sb.setAttribute('aria-pressed',on)}; syncSize();
  sb.onclick=()=>{document.body.classList.toggle('large');syncSize()};
  const ra=$('#readAloud'); let reading=false;
  const stopRead=()=>{reading=false;Speech.stop();ra.classList.remove('on');ra.innerHTML='🔊 Lees voor';app.querySelectorAll('.para').forEach(p=>p.classList.remove('speaking'))};
  ra.onclick=()=>{ if(reading){stopRead();return} if(!Speech.ok){toast('Voorlezen werkt niet in deze browser.');return}
    reading=true; ra.classList.add('on'); ra.innerHTML='⏹ Stop';
    const paras=[...app.querySelectorAll('.para')];
    Speech.sequence([d.title, plain(d.lead), ...d.paragraphs.map(plain)],{rate:.9,gap:350,
      onstep:i=>{ paras.forEach(p=>p.classList.remove('speaking')); if(i>=2){ paras[i-2].classList.add('speaking'); paras[i-2].scrollIntoView({behavior:'smooth',block:'center'}); } if(!reading) Speech.stop(); },
      onend:()=>{ if(reading) stopRead(); }});
  };
}

function openWord(d,key,onFound){
  const w=d.words[key]; state.found[d.id].add(key); onFound&&onFound();
  layer.innerHTML = `<div class="overlay" id="ov"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="wTitle">
    <div class="dialog-visual"><div class="big-emoji">${w.emoji}</div><button class="close-x" id="closeW" aria-label="Sluiten">✕</button></div>
    <div class="dialog-body"><h2 id="wTitle">${esc(key)}</h2>
      <div class="syllables" id="syls">${w.syl.map(s=>`<span class="syl">${esc(s)}</span>`).join('')}</div>
      <p class="explain">${esc(w.explain)}</p><p class="example">“${esc(w.example)}”</p>
      <div class="btn-row"><button class="btn btn-primary" id="sayW">🔊 Luister</button><button class="btn btn-ghost" id="sylW">👏 In stukjes${w.syl.length>1?' ('+w.syl.length+')':''}</button><button class="btn btn-ghost" id="sayEx">💬 Voorbeeldzin</button></div>
      ${Speech.ok?'':'<div class="speech-note">Uitspreken werkt niet in deze browser.</div>'}</div></div></div>`;
  const close=()=>{Speech.stop();layer.innerHTML='';document.removeEventListener('keydown',esck)};
  const esck=e=>{if(e.key==='Escape')close()}; document.addEventListener('keydown',esck);
  $('#ov').onclick=e=>{if(e.target.id==='ov')close()}; $('#closeW').onclick=close;
  const syls=[...layer.querySelectorAll('.syl')]; const clear=()=>syls.forEach(s=>s.classList.remove('active'));
  $('#sayW').onclick=()=>{ clear(); syls.forEach(s=>s.classList.add('active')); Speech.say(key,{rate:.8,onend:clear}); };
  $('#sylW').onclick=()=>{ Speech.sequence(w.syl,{rate:.7,gap:300,onstep:i=>{clear();syls[i].classList.add('active')},onend:()=>{ syls.forEach(s=>s.classList.add('active')); Speech.say(key,{rate:.8,onend:clear}); }}); };
  $('#sayEx').onclick=()=>{ clear(); Speech.say(w.example,{rate:.88}); };
  $('#sayW').focus();
}

/* ---------------- leeractiviteiten ---------------- */
const PRAISE=['Goed gezien!','Top!','Precies!','Knap gedaan!','Ja, dat klopt!','Super!'];
const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];
function renderActivity(){
  const d=byId[state.current], a=d.activity; applyTheme(d);
  app.innerHTML = `<section class="act-screen">
    <div class="story-toolbar"><button class="tool" id="toStory">← Terug naar het verhaal</button></div>
    <div class="act-head"><div class="act-emoji">${a.emoji}</div><div><div class="eyebrow">${esc(d.place)}</div><h1>${esc(a.title)}</h1><p>${esc(a.intro)}</p></div></div>
    <div class="act-body" id="actBody"></div></section>`;
  $('#toStory').onclick=()=>go('story',d.id);
  ({match:actMatch,fill:actFill,spot:actSpot})[a.type](d,$('#actBody'));
}
function feedback(el,type,html){ el.className='feedback '+type; el.innerHTML=html; }
function finish(d){ state.stamps.add(d.id); saveStamps(); updateStampCount(); setTimeout(()=>go('done',d.id),1100); }

function actMatch(d,body){
  const keys=Object.keys(d.words), pics=d.activity.pics; let selW=null, selP=null, done=0;
  body.innerHTML = `<div class="match-grid"><div><div class="col-title">Woorden</div><div class="m-words">${shuffle(keys).map(k=>`<button class="m-word" data-k="${k}">${k}<span class="mini-say" data-say="${k}">🔊</span></button>`).join('')}</div></div>
    <div><div class="col-title">Plaatjes</div><div class="m-pics">${shuffle(keys).map(k=>`<button class="m-pic" data-k="${k}" data-label="${k}"><span>${pics[k].e}<small>${esc(pics[k].t)}</small></span></button>`).join('')}</div></div></div>
    <div class="feedback neutral" id="fb">👉 Begin met een woord of een plaatje. Je mag het zo vaak proberen als je wilt.</div>`;
  const fb=$('#fb');
  const check=()=>{ if(!selW||!selP) return; const wb=body.querySelector(`.m-word[data-k="${selW}"]`), pb=body.querySelector(`.m-pic[data-k="${selP}"]`);
    if(selW===selP){ wb.classList.remove('sel');pb.classList.remove('sel'); wb.classList.add('matched');pb.classList.add('matched'); wb.disabled=pb.disabled=true; done++;
      Speech.say(selW,{rate:.85}); feedback(fb,'ok',`🎉 ${praise()} <b>${selW}</b> hoort bij dit plaatje. ${done<keys.length?`Nog ${keys.length-done} te gaan.`:''}`);
      if(done===keys.length){ feedback(fb,'ok','🎉 '+esc(d.activity.doneMsg)); finish(d); } }
    else { [wb,pb].forEach(x=>{x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake')}); wb.classList.remove('sel');pb.classList.remove('sel');
      feedback(fb,'hint',`🤔 Bijna! Dit plaatje hoort bij een ander woord. Weet je het nog? <b>${selW}</b> betekent: ${esc(d.words[selW].explain)}`); }
    selW=selP=null; };
  body.querySelectorAll('.m-word').forEach(b=>b.onclick=e=>{ if(e.target.dataset.say){ e.stopPropagation(); Speech.say(e.target.dataset.say,{rate:.8}); }
    if(b.disabled) return; body.querySelectorAll('.m-word').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); selW=b.dataset.k; check(); });
  body.querySelectorAll('.m-pic').forEach(b=>b.onclick=()=>{ if(b.disabled) return; body.querySelectorAll('.m-pic').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); selP=b.dataset.k; check(); });
}

function actFill(d,body){
  const items=d.activity.items; let i=0;
  const show=()=>{ const it=items[i];
    body.innerHTML = `<div class="progress-dots">${items.map((_,k)=>`<span class="${k<i?'done':k===i?'now':''}"></span>`).join('')}</div>
      <p class="fill-sentence">${esc(it.s).replace('___','<span class="blank" id="blank">&nbsp;</span>')}</p>
      <div class="chips">${Object.keys(d.words).map(k=>`<button class="choice" data-k="${k}">${k}</button>`).join('')}</div>
      <div class="feedback neutral" id="fb">✏️ Welk woord maakt de zin compleet? Lees de zin eerst rustig.</div>
      <div class="btn-row" style="margin-top:14px"><button class="btn btn-ghost" id="readS">🔊 Lees de zin voor</button><button class="btn btn-primary hidden" id="next">${i<items.length-1?'Volgende zin →':'Klaar!'}</button></div>`;
    const fb=$('#fb');
    $('#readS').onclick=()=>Speech.say(it.s.replace('___','…'),{rate:.88});
    body.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{ const k=c.dataset.k;
      if(k===it.a){ const bl=$('#blank'); bl.textContent=k; bl.classList.add('filled'); body.querySelectorAll('.choice').forEach(x=>x.disabled=true);
        Speech.say(it.s.replace('___',k),{rate:.9}); feedback(fb,'ok',`🎉 ${praise()} Een <b>${k}</b>: ${esc(d.words[k].explain.split('.')[0].toLowerCase())}.`); $('#next').classList.remove('hidden'); $('#next').focus(); }
      else { c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake'); c.classList.add('used');
        feedback(fb,'hint',`🤔 Een <b>${k}</b> is: ${esc(d.words[k].explain)} Past dat in deze zin? Probeer een ander woord.`); } });
    $('#next').onclick=()=>{ i++; if(i<items.length) show(); else { feedback(fb,'ok','🎉 '+esc(d.activity.doneMsg)); $('#next').disabled=true; finish(d); } };
  }; show();
}

function actSpot(d,body){
  const items=d.activity.items; let i=0, tries=0;
  const show=()=>{ const it=items[i]; tries=0;
    const toks=it.s.split(' ').map((t,k)=>{ const clean=t.replace(/[.,!?‘’“”]/g,''); return `<button class="tok" data-w="${esc(clean.toLowerCase())}">${esc(t)}</button>`; }).join(' ');
    body.innerHTML = `<div class="progress-dots">${items.map((_,k)=>`<span class="${k<i?'done':k===i?'now':''}"></span>`).join('')}</div>
      <div class="message"><div class="avatar">${d.activity.avatar||'💬'}</div><div class="bubble">${esc(it.hint)}<button class="say" id="sayHint" aria-label="Hint voorlezen">🔊</button></div></div>
      <div class="spot-sentence">${toks}</div>
      <div class="feedback neutral" id="fb">🔍 Tik op het woord in het bericht dat bij de hint past.</div>
      <div class="btn-row" style="margin-top:14px"><button class="btn btn-ghost" id="readS">🔊 Lees het bericht voor</button><button class="btn btn-primary hidden" id="next">${i<items.length-1?'Volgend bericht →':'Klaar!'}</button></div>`;
    const fb=$('#fb'), w=d.words[it.a];
    $('#sayHint').onclick=()=>Speech.say(it.hint,{rate:.88}); $('#readS').onclick=()=>Speech.say(it.s,{rate:.88});
    body.querySelectorAll('.tok').forEach(t=>t.onclick=()=>{ if(t.dataset.w===it.a){ t.classList.add('right'); body.querySelectorAll('.tok').forEach(x=>x.disabled=true);
        Speech.say(it.a,{rate:.8}); feedback(fb,'ok',`🎉 ${praise()} <b>${it.a}</b> – ${w.syl.join(' · ')}`); $('#next').classList.remove('hidden'); $('#next').focus(); }
      else { tries++; t.classList.add('wrong'); setTimeout(()=>t.classList.remove('wrong'),700);
        const tip = tries===1 ? `Het woord dat we zoeken begint met een <b>${it.a[0]}</b>.` : `Het woord heeft ${w.syl.length} stukjes: <b>${w.syl.map((s,k)=>k===0?s:'_'.repeat(s.length)).join(' · ')}</b>`;
        feedback(fb,'hint',`🤔 Dat is het woord niet, maar je bent goed bezig! Tip: ${tip}`); } });
    $('#next').onclick=()=>{ i++; if(i<items.length) show(); else { feedback(fb,'ok','🎉 '+esc(d.activity.doneMsg)); $('#next').disabled=true; finish(d); } };
  }; show();
}

function renderDone(){
  const d=byId[state.current]; applyTheme(d); const bk=currentBook();
  const left=currentStories().filter(x=>!state.stamps.has(x.id));
  app.innerHTML = `<section class="done-screen"><div class="done-card">
    <div class="stamp">${stampSVG(d)}</div><div class="eyebrow">Stempel verdiend</div><h1>Wat een reis!</h1>
    <p>Je hebt het verhaal <b>${esc(d.title)}</b> gelezen en deze woorden ontdekt:</p>
    <div class="learned">${Object.keys(d.words).map(k=>`<button class="chip" data-k="${k}">🔊 ${k}</button>`).join('')}</div>
    <p style="margin-bottom:22px">${left.length?`In <b>${esc(bk.title)}</b> wachten nog ${left.length} ${left.length===1?'bestemming':'bestemmingen'} op je.`:`Je hebt alle verhalen uit <b>${esc(bk.title)}</b> gelezen. Boek uit! 🎉`}</p>
    <div class="btn-row" style="justify-content:center">${left.length?'<button class="btn btn-primary" id="again">🌍 Kies een nieuw avontuur</button>':'<button class="btn btn-primary" id="nextBook">📚 Kies je volgende boek</button><button class="btn btn-ghost" id="again">🌍 Terug naar de wereld</button>'}<button class="btn btn-ghost" id="reread">📖 Lees nog eens</button></div></div></section>`;
  $('#nextBook')&&($('#nextBook').onclick=()=>go('books'));
  app.querySelectorAll('.learned .chip').forEach(c=>c.onclick=()=>Speech.say(c.dataset.k,{rate:.8}));
  $('#again').onclick=()=>{ state.selected=null; go('globe'); };
  $('#reread').onclick=()=>go('story',d.id);
}

function openPassport(){
  const act=currentStories(), bk=currentBook();
  layer.innerHTML = `<div class="overlay" id="ov"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ppT"><div class="dialog-body">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 id="ppT" style="color:var(--blue-2);font-size:30px">🛂 Mijn reispaspoort</h2><button class="close-x" style="position:static" id="closeP" aria-label="Sluiten">✕</button></div>
    <p class="explain" style="color:var(--ink-soft);font-size:16px;margin-top:8px">${bk?`Stempels uit <b>${esc(bk.title)}</b> (${bookLabel(bk)}).`:'Kies eerst een leesboek.'} Lees een verhaal en maak de opdracht om een stempel te verdienen. In totaal heb je ${state.stamps.size} ${state.stamps.size===1?'stempel':'stempels'}.</p>
    <div class="pp-grid">${act.map(x=>`<div class="pp-slot">${state.stamps.has(x.id)?stampSVG(x):`<span>${x.emoji}<br>${esc(x.short||x.place.split(',')[0])}<br>nog niet bezocht</span>`}</div>`).join('')}</div>
    <div class="btn-row" style="margin-top:16px"><button class="btn btn-ghost" id="resetP">Paspoort leegmaken</button></div></div></div></div>`;
  const close=()=>layer.innerHTML='';
  $('#ov').onclick=e=>{if(e.target.id==='ov')close()}; $('#closeP').onclick=close;
  $('#resetP').onclick=()=>{ state.stamps.clear(); saveStamps(); updateStampCount(); openPassport(); if(state.screen==='globe') renderPanel(); if(state.screen==='books') renderBooks(); };
}

$('#homeBtn').onclick=()=>{ state.selected=null; go('globe'); };
$('#passportBtn').onclick=openPassport;
$('#bookChip').onclick=()=>go('books');
if(state.book && !(BOOK_BY[state.book]&&BOOK_BY[state.book].stories)) state.book=null;
updateHeader();
go(state.book?'globe':'books');
</script>
</body>
